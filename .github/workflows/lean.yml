name: Lean algebraic certificates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          lean --version
          lake update
          lake exe cache get
      - name: Reject unfinished proofs and custom axioms
        run: |
          if grep -En '^[[:space:]]*(axiom|opaque)[[:space:]]|\b(sorry|admit)\b' F19.lean F19/*.lean; then
            exit 1
          fi
          lake build
          set -o pipefail
          for module in F19/*.lean; do
            lake env lean "$module"
          done | tee lean-axioms.txt
          if grep -Eq 'sorryAx' lean-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-axiom-report
          path: |
            lean-axioms.txt
            lake-manifest.json
