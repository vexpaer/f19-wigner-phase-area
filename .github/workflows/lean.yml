name: Lean algebraic certificates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Reject unfinished proofs and custom axioms
        run: |
          if grep -En '^[[:space:]]*(axiom|opaque)[[:space:]]|\b(sorry|admit)\b' F19.lean F19/*.lean; then
            exit 1
          fi
          set -o pipefail
          lake env lean F19/Algebra.lean | tee lean-axioms.txt
          if grep -Eq 'sorryAx' lean-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: lean-axiom-report
          path: lean-axioms.txt
