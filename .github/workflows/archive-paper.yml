name: Build archival manuscript PDF
on:
  push:
    branches: [main]
    paths:
      - 'paper/manuscript.tex'
      - '.github/workflows/archive-paper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Compile manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
          pdflatex -interaction=nonstopmode -halt-on-error manuscript.tex
          test -s manuscript.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: f19-manuscript
          path: paper/manuscript.pdf
      - name: Commit PDF to the source tree
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/manuscript.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build archival manuscript PDF"
          git push origin HEAD:main
